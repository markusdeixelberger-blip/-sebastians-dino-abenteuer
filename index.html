function collectible(o){var sx=o.x-cam,sy=o.y+Math.sin(time*4+o.x)*5;if(level===2){g.fillStyle="#ffd53e";g.beginPath();for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,r=i%2?10:25;var xx=sx+Math.cos(a)*r,yy=sy+Math.sin(a)*r;if(i===0)g.moveTo(xx,yy);else g.lineTo(xx,yy);}g.closePath();g.fill();}else{g.fillStyle="#fff2d5";g.beginPath();g.ellipse(sx,sy,20,27,0,0,Math.PI*2);g.fill();circle(sx-6,sy-5,4,"#b77b4b");circle(sx+7,sy+8,4,"#b77b4b");}}
function rock(o){var sx=o.x-cam;g.fillStyle="#85847e";g.beginPath();g.moveTo(sx-30,ground);g.lineTo(sx-23,ground-38);g.lineTo(sx,ground-48);g.lineTo(sx+27,ground-34);g.lineTo(sx+31,ground);g.closePath();g.fill();}
function dog(img,sx,off){g.save();g.translate(sx,ground-68+Math.sin(time*12+off)*3);g.beginPath();g.arc(0,-25,30,0,Math.PI*2);g.clip();g.drawImage(img,-34,-64,68,100);g.restore();}
function sebastian(){
 var sx=W*.28,bob=onGround?Math.sin(time*14)*3:0,run=Math.sin(time*14)*10;g.save();g.translate(sx,py+bob);
 g.strokeStyle="#315ba7";g.lineWidth=13;g.lineCap="round";g.beginPath();g.moveTo(-8,-55);g.lineTo(-10+run,-5);g.moveTo(8,-55);g.lineTo(10-run,-5);g.stroke();
 g.fillStyle="#f0a91d";g.fillRect(-27,-112,54,62);
 g.strokeStyle="#f2c39e";g.lineWidth=11;g.beginPath();g.moveTo(-22,-100);g.lineTo(-38-run*.4,-70);g.moveTo(22,-100);g.lineTo(38+run*.4,-70);g.stroke();
 g.save();g.translate(0,-154);g.beginPath();g.ellipse(0,0,62,66,0,0,Math.PI*2);g.clip();g.drawImage(head,-68,-68,136,136);g.restore();g.restore();
}
function trex(sx){g.save();g.translate(sx,ground);g.fillStyle="#4f9b58";g.beginPath();g.ellipse(0,-105,90,75,0,0,Math.PI*2);g.fill();g.fillRect(-45,-80,28,80);g.fillRect(25,-80,28,80);g.beginPath();g.ellipse(70,-190,75,48,0,0,Math.PI*2);g.fill();circle(92,-202,12,"white");circle(96,-202,6,"#17331c");g.restore();}
function draw(){
 background();var i;for(i=0;i<items.length;i++)if(!items[i].taken)collectible(items[i]);for(i=0;i<rocks.length;i++)rock(rocks[i]);
 if(finish<999999){if(level===3)trex(finish-cam+140);else{g.fillStyle="#7b4f2a";g.fillRect(finish-cam,ground-150,16,150);g.fillStyle="#ffd35a";g.fillRect(finish-cam-60,ground-200,140,55);}}
 dog(dog1,W*.28-95,0);dog(dog2,W*.28-155,2);sebastian();
}
function showWin(){
 mode="win";hud.style.display="none";jumpBtn.style.display="none";screen.style.display="flex";
 card.innerHTML='<img class="face" src="'+HEAD+'"><div style="font-size:55px">🎉🦖🎉</div><h1 style="font-size:45px">SUPER, SEBASTIAN!</h1><p>'+(level===3?"Du hast den freundlichen T-Rex gefunden!":"Abenteuer geschafft!")+'</p><button id="again" class="mainbtn">NOCH EIN LEVEL</button>';
 document.getElementById("again").addEventListener("click",function(){mode="menu";showLevels();});
}
function loop(now){var dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
